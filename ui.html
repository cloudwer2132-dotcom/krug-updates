.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--a2);padding:12px 22px;border-radius:99px;z-index:30;animation:in .3s;box-shadow:0 10px 40px #0008;max-width:80vw;text-align:center}#upd{position:fixed;top:12px;right:18px;z-index:25}.upd{background:var(--grad);color:#fff;border:0;border-radius:99px;padding:6px 15px;font-weight:600;font-size:12.5px;font-family:inherit;cursor:pointer;box-shadow:0 6px 24px color-mix(in srgb,var(--a2) 45%,transparent);animation:in .4s,pg 2.4s ease-in-out infinite}@keyframes pg{50%{transform:translateY(-1px) scale(1.05)}}.upd:disabled{opacity:.75;animation:none}</style></head><body>
<nav class="sb"><div id="sb" style="flex:1;display:flex;flex-direction:column;gap:3px;min-height:0;overflow:auto"></div><div id="gm" style="display:none;padding:10px 4px 0"><div class="cd" style="padding:6px"><canvas id="gc" width="212" height="96" style="width:100%;display:block;cursor:pointer;border-radius:10px"></canvas></div></div></nav>
<main><div id="view"></div>
<div id="cp"><textarea id="inp" rows="1" placeholder="Напиши Кругу… («напомни через 15 минут позвонить маме»)"></textarea><select id="prv"></select><button class="bt snd" data-a="send" title="Отправить"></button></div></main>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],PR={'Высокий':0,'Средний':1,'Низкий':2},BI='Krug Brain (встроенный)';
const PROV=[BI,'OpenAI','Anthropic','Gemini','OpenRouter','Groq','DeepSeek','Ollama (локально)','Своё (OpenAI-совместимое)'];
const ACC=[['#6ea8ff','#b78cff','#ff8fb8'],['#34d399','#22d3ee','#60a5fa'],['#fb923c','#f43f5e','#c084fc'],['#facc15','#fb923c','#f472b6']];
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
tasks:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',sched:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',rem:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
habits:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
prompts:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',send:'<path d="M5 12h14M13 6l6 6-6 6"/>',
del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',ok:'<path d="m5 12 5 5 9-10"/>',sound:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',design:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2.2-.5-1.3.3-2.3 1.7-2.3H17a4 4 0 0 0 4-4c0-5-4-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15.5" cy="7.5" r="1"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`,uid=()=>Math.random().toString(36).slice(2,10),pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,api=()=>window.pywebview.api;
const NAV=[['chat','Помощник'],['today','Сегодня'],['tasks','Задачи'],['sched','Расписание'],['rem','Напоминания'],['habits','Привычки'],['notes','Заметки'],['prompts','Промпты'],['sound','Звуки'],['design','Дизайн'],['focus','Фокус'],['set','Настройки']];
let S={},view='chat',busy=false,nid=null,st;
const save=()=>{clearTimeout(st);st=setTimeout(()=>{const{tasks,sched,rem,notes,habits,prompts,sounds,designs,cfg}=S;api().save({tasks,sched,rem,notes,habits,prompts,sounds,designs,cfg})},150)};
const mut=f=>{f();save();go(view,1)},hd=(t,s='')=>`<div class="hd"><h2>${t}</h2><span>${s}</span></div>`,emp=t=>`<div class="em">${t}</div>`;
const fm=t=>esc(t).replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');

const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.8);o.start();o.stop(a.currentTime+.8)}catch(e){}};

const V={};
V.chat=()=>'<div id="msgs"></div>';
V.today=()=>{const o=S.tasks.filter(t=>!t.done).length,r=S.rem.filter(x=>x.on).length,b=Math.max(0,...S.habits.map(h=>streak(h.log)));
return `<div class="hd"><div><div id="clk"></div><span id="dt"></span></div></div><div class="stats"><div class="cd"><b>${o}</b>открытых задач</div><div class="cd"><b>${r}</b>активных напоминаний</div><div class="cd"><b>${b}</b>дней — лучшая серия</div></div><div class="cd"><h3 style="margin-top:0">План дня</h3><div id="plan">…</div></div>`};
